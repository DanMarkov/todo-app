<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do Application</title>
</head>
<body>
    <div class="whole-container">
        <div class="projects-container">
            <div class="projects-header">
                <h2>Your Projects</h2>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>list-box-outline</title><path d="M11 15H17V17H11V15M9 7H7V9H9V7M11 13H17V11H11V13M11 9H17V7H11V9M9 11H7V13H9V11M21 5V19C21 20.1 20.1 21 19 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H19C20.1 3 21 3.9 21 5M19 5H5V19H19V5M9 15H7V17H9V15Z" /></svg>
            </div>
            <div class="todo-body">
                <svg  class="primary" id="open" aria-label="open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>plus</title><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
            </div>
            <h5 id="Alert"></h5>
            <ul id="list-project-items" class="list-items"></ul>
        </div>

        <dialog id="project-dialog">
            <form action="" method="dialog">
                <div class="project-name-wrapper">
                    <label for="title">Enter your project name:</label>
                    <input type="text" id="project-name" class="project-name" name="title">
                </div>

                <div>
                    <button value="cancel" id="cancel" formmethod="dialog"  aria-label="close">Cancel</button>
                    <button value="default" id="AddProjectUpdateClick"  formmethod="dialog" onclick="createProjectItems();" >Confirm</button>
                </div>
            </form>
            <button aria-label="close" class="x" id="close">❌</button>
        </dialog>
    
        <div class="container">
            <div class="todo-header">
                <h2>ToDo List</h2>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>notebook-edit-outline</title><path d="M19.07 14.88L21.12 16.93L15.06 23H13V20.94L19.07 14.88M21.04 13.13C21.18 13.13 21.31 13.19 21.42 13.3L22.7 14.58C22.92 14.79 22.92 15.14 22.7 15.35L21.7 16.35L19.65 14.3L20.65 13.3C20.76 13.19 20.9 13.13 21.04 13.13M17 4V10L15 8L13 10V4H9V20H11V22H7C5.95 22 5 21.05 5 20V19H3V17H5V13H3V11H5V7H3V5H5V4C5 2.89 5.9 2 7 2H19C20.05 2 21 2.95 21 4V10L19 12V4H17M5 5V7H7V5H5M5 11V13H7V11H5M5 17V19H7V17H5Z" /></svg>
           </div>
           <div class="todo-body">
                <svg  class="primary" onclick="window.dialog.showModal();" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>plus</title><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
            </div>
            <h5 id="Alert"></h5>
            <ul id="list-items" class="list-items"></ul>
        </div>
    
        <dialog id="dialog">
            <form action="" method="dialog">
                <div class="title-wrapper">
                    <label for="title">Title:</label>
                    <input
                    type="text"
                    id="todoText"
                    class="todo-input"
                    name="title"
                    />
                </div>
                <div class="description-wrapper">
                    <label for="description">Description:</label>
                    <textarea name="description" id="description"></textarea>
                </div>
                <div class="dueDate-wrapper">
                    <label for="dueDate">Due Date:</label>
                    <input type="date" name="dueDate" id="dueDate">
                </div>
                <div class="priority-wrapper">
                    <label for="priority">Priority:</label>
                    <select name="priority" id="priority">
                        <option>Not important</option>
                        <option>Important</option>
                        <option>Very important!</option>
                    </select>
                </div>
                <div>
                    <button value="cancel" formmethod="dialog" onclick="window.dialog.close();" aria-label="close">Cancel</button>
                    <button value="default" id="AddUpdateClick" onclick="CreateToDoItems();">Confirm</button>
                </div>
            </form>
            <button onclick="window.dialog.close();" aria-label="close" class="x">❌</button>
        </dialog>
    </div>
</body>
</html>
